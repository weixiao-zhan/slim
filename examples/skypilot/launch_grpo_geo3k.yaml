# GSPO on Geo3K VLM — 2 nodes, colocated rollout (no critic needed)
# USAGE (run from examples/skypilot/ so SkyPilot picks up .sky.yaml):
#   sky launch launch_grpo_geo3k.yaml --env-file ../../.env -c miniSlime
#   sky exec miniSlime launch_grpo_geo3k.yaml --env-file ../../.env

name: gspo-geo3k

workdir: ../..

num_nodes: 1

resources:
  infra: aws/us-west-1
  instance_type: p5.48xlarge
  disk_size: 500
  network_tier: best  # Enables EFA
  image_id:
    us-east-1: ami-0174b3ccd6205fa2c
    us-east-2: ami-09ff047017f875dd1
    us-west-1: ami-06db04dfe605fb44c
    us-west-2: ami-002d8d829a188f605

envs:
  MODEL_NAME: Qwen3-VL-2B-Instruct

setup: | # shell
  set -ex
  uv sync
  # FA3 (Hopper kernels) for --attn-implementation flash_attention_3
  uv pip install flash_attn_3 --find-links https://windreamer.github.io/flash-attention3-wheels/cu128_torch280

run: | # shell
  set -ex
  uv sync
  # Re-install FA3 after uv sync (uv removes packages not in pyproject.toml)
  uv pip install flash_attn_3 --find-links https://windreamer.github.io/flash-attention3-wheels/cu128_torch280
  # Download model and prepare dataset
  mkdir -p /home/ubuntu/models /home/ubuntu/datasets
  if [ ! -d "/home/ubuntu/models/${MODEL_NAME}" ]; then
    uv run hf download "Qwen/${MODEL_NAME}" --local-dir "/home/ubuntu/models/${MODEL_NAME}"
  fi
  if [ ! -f "/home/ubuntu/datasets/geo3k/train.parquet" ]; then
    uv run python tests/prepare_geo3k_processor_ready.py
  fi

  # =========================================================================
  # Ray cluster setup — custom ports to avoid conflicts with SkyPilot's
  # internal Ray (port 6380/8266). Never use `ray stop` directly.
  # =========================================================================
  MASTER_ADDR=$(echo $SKYPILOT_NODE_IPS | awk '{print $1}')

  # Use non-default ports to avoid conflict with SkyPilot's own Ray cluster
  RAY_PORT=20001
  RAY_DASHBOARD_PORT=20002
  RAY_DASHBOARD_AGENT_LISTEN_PORT=20003
  RAY_DASHBOARD_AGENT_GRPC_PORT=20004
  RAY_CLIENT_SERVER_PORT=20005
  RAY_OBJECT_MANAGER_PORT=20006
  RAY_NODE_MANAGER_PORT=20007
  RAY_METRICS_EXPORT_PORT=20008
  RAY_MIN_WORKER_PORT=20010
  RAY_MAX_WORKER_PORT=20999

  # Kill any previous Ray on our port (not SkyPilot's on 6380)
  pkill -f "ray.*[=:]${RAY_PORT}" 2>/dev/null || true
  pkill -9 sglang 2>/dev/null || true
  pkill -9 slime 2>/dev/null || true
  lsof -ti :${RAY_PORT} | xargs -r kill -9 2>/dev/null || true
  sleep 10

  # Worker nodes: connect to Ray head and block
  if [ "${SKYPILOT_NODE_RANK}" != "0" ]; then
    echo "=== Starting Ray worker node (rank ${SKYPILOT_NODE_RANK}) ==="
    WORKER_IP=$(echo $SKYPILOT_NODE_IPS | awk -v idx=$((SKYPILOT_NODE_RANK + 1)) '{print $idx}')

    uv run ray start \
      --address=${MASTER_ADDR}:${RAY_PORT} \
      --num-gpus ${SKYPILOT_NUM_GPUS_PER_NODE} \
      --node-ip-address ${WORKER_IP} \
      --disable-usage-stats \
      --dashboard-agent-listen-port=${RAY_DASHBOARD_AGENT_LISTEN_PORT} \
      --dashboard-agent-grpc-port=${RAY_DASHBOARD_AGENT_GRPC_PORT} \
      --object-manager-port=${RAY_OBJECT_MANAGER_PORT} \
      --node-manager-port=${RAY_NODE_MANAGER_PORT} \
      --min-worker-port=${RAY_MIN_WORKER_PORT} \
      --max-worker-port=${RAY_MAX_WORKER_PORT} \
      --metrics-export-port=${RAY_METRICS_EXPORT_PORT} \
      --block

    echo "=== Worker node exiting ==="
    exit 0
  fi

  # =========================================================================
  # Head node: start Ray head
  # =========================================================================
  echo "=== Starting Ray head node ==="
  uv run ray start --head \
    --node-ip-address ${MASTER_ADDR} \
    --num-gpus ${SKYPILOT_NUM_GPUS_PER_NODE} \
    --disable-usage-stats \
    --port=${RAY_PORT} \
    --dashboard-host=0.0.0.0 \
    --dashboard-port=${RAY_DASHBOARD_PORT} \
    --dashboard-agent-listen-port=${RAY_DASHBOARD_AGENT_LISTEN_PORT} \
    --dashboard-agent-grpc-port=${RAY_DASHBOARD_AGENT_GRPC_PORT} \
    --ray-client-server-port=${RAY_CLIENT_SERVER_PORT} \
    --object-manager-port=${RAY_OBJECT_MANAGER_PORT} \
    --node-manager-port=${RAY_NODE_MANAGER_PORT} \
    --min-worker-port=${RAY_MIN_WORKER_PORT} \
    --max-worker-port=${RAY_MAX_WORKER_PORT} \
    --metrics-export-port=${RAY_METRICS_EXPORT_PORT}

  # =========================================================================
  # Head node: submit training job
  # =========================================================================
  MODEL_DIR="/home/ubuntu/models/${MODEL_NAME}"
  DATASET_DIR="/home/ubuntu/datasets/geo3k"
  OUTPUT_DIR="/home/ubuntu/outputs/grpo-geo3k-${MODEL_NAME,,}"

  # Wandb args (only if WANDB_API_KEY is set)
  WANDB_ARGS=()
  if [ -n "${WANDB_API_KEY}" ]; then
    WANDB_ARGS=(
      --use-wandb
      --wandb-project minislime
      --wandb-group "gspo-geo3k-${MODEL_NAME,,}"
      --wandb-key "${WANDB_API_KEY}"
      --disable-wandb-random-suffix
    )
  fi

  RUNTIME_ENV_JSON="{
    \"env_vars\": {
      \"RAY_DEDUP_LOGS\": \"1\",
      \"NCCL_NVLS_ENABLE\": \"1\",
      \"LD_LIBRARY_PATH\": \"/home/ubuntu/sky_workdir/.venv/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:${LD_LIBRARY_PATH}\"
    }
  }"

  uv run ray job submit --address="http://${MASTER_ADDR}:${RAY_DASHBOARD_PORT}" \
    --runtime-env-json="${RUNTIME_ENV_JSON}" \
    -- python3 train.py \
    --hf-checkpoint ${MODEL_DIR} \
    \
    --prompt-data ${DATASET_DIR}/train.parquet \
    --rm-type math \
    --num-rollout 200 \
    --rollout-batch-size 32 \
    --n-samples-per-prompt 16 \
    --rollout-max-context-len 16384 \
    --rollout-temperature 1 \
    --num-steps-per-rollout 1 \
    --dynamic-sampling-filter-path slime.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std \
    --over-sampling-batch-size 48 \
    \
    --eval-interval 20 \
    --skip-eval-before-train \
    --eval-prompt-data geo3k ${DATASET_DIR}/test.parquet \
    --n-samples-per-eval-prompt 1 \
    --eval-max-context-len 16384 \
    --save ${OUTPUT_DIR} \
    --save-interval 40 \
    \
    --rollout-num-gpus-per-engine 1 \
    --sglang-mem-fraction-static 0.6 \
    --sglang-attention-backend fa3 \
    --sglang-mm-enable-dp-encoder \
    --log-passrate \
    --colocate \
    \
    --actor-num-nodes ${SKYPILOT_NUM_NODES} \
    --actor-num-gpus-per-node ${SKYPILOT_NUM_GPUS_PER_NODE} \
    --attn-implementation flash_attention_3 \
    --gradient-checkpointing \
    --update-weight-buffer-size 536870912 \
    --use-dynamic-batch-size \
    --max-tokens-per-gpu 16384 \
    \
    --advantage-estimator gspo \
    --disable-grpo-std-normalization \
    --use-rollout-logprobs \
    --eps-clip 0.2 \
    --eps-clip-high 0.28 \
    --entropy-coef 0.0 \
    --kl-coef 0.0 \
    \
    --optimizer adam \
    --lr 1e-5 \
    --lr-warmup-iters 10 \
    --lr-decay-style constant \
    --weight-decay 0.1 \
    --adam-beta1 0.9 \
    --adam-beta2 0.98 \
    \
    ${WANDB_ARGS[@]}
