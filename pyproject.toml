[project]
name = "slim"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets>=3.2.0",
    "dion",
    "flash-attn",
    "flash-attn-3",
    "httpx[http2]",
    "liger-kernel",
    "nemo-automodel[fla,vlm]==0.7.0",
    "omegaconf",
    "packaging",
    "orjson",
    "pylatexenc",
    "pybase64",
    "pyyaml",
    "ray[default]",
    "requests",
    "sglang==0.5.23",
    "sglang-router==0.3.2.post2",
    "sympy",
    "torch==2.14.1",
    "tqdm",
    "transformers==5.19.0",
    "wandb",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
slim-train = "slim.train:main"
slim-train-async = "slim.train_async:main"

[project.optional-dependencies]
dev = [
    "memray",
    "nvidia-ml-py",
    "pillow",
    "pre-commit",
    "pytest",
    "ruff",
    "viztracer",
]
strands = [
    "strands-agents[openai]",
    "strands-agents-tools",
]
quant = [
    "nvidia-modelopt==0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slim"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
dion = { git = "https://github.com/microsoft/dion", rev = "7692479288f928a3d61d1cc58137b4dbe4f71000" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.0/flash_attn-2.8.3%2Bcu130torch2.14-cp312-cp312-linux_x86_64.whl" }
flash-attn-3 = { url = "https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.10.26-71be1b9/flash_attn_3-3.0.1%2B20261026.cu130torch2141cxx11abitrue.98c1ce-cp310-abi3-linux_x86_64.whl" }
# Forked gateway: the released wheel forwards the SGLang request fields upstream drops.
sglang-router = { url = "https://github.com/weixiao-zhan/sgl-model-gateway/releases/download/v0.3.2.post2/sglang_router-0.3.2.post2-cp38-abi3-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.isort]
profile = "black"  # black-compatible
line_length = 119  # should match black parameters
ignore_whitespace = true  # ignore whitespace for compatibility with the initial style
py_version = 312  # python 3.12 as a target version
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
extend_skip = ["setup.py", "docs/source/conf.py"]
known_first_party = ["slim"]
known_third_party = ["wandb", "ray", "transformers"]
src_paths = ["slim"]

[tool.black]
line_length = 119

[tool.ruff]
line-length = 320  # TODO

[tool.ruff.lint]
select = [
    "E",      # Pycodestyle Errors (Structural/Fundamental Errors like bad indentation)
    "F",      # Pyflakes (Core Errors: Unused imports, undefined names)
    "B",      # Flake8-Bugbear (Logic Bugs: Variable shadowing, dangerous default arguments)
    "UP",     # pyupgrade (Modernization and compatibility issues)
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "E501", # Line too long # TODO handle it later
]

[tool.pytest.ini_options]
# durations=0 will display all tests execution time, sorted in ascending order starting from from the slowest one.
# -vv will also display tests with duration = 0.00s
addopts = "--verbose --pyargs --durations=0 --strict-markers"  # always add these arguments to pytest
testpaths = ["./tests"]  # must be an explicit path to avoid importing another "tests" module
# directories to ignore when discovering tests
norecursedirs = [
    "external",
    "examples",
    "docs",
    "scripts",
    "tools",
    "tutorials",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "venv",
    "{arch}",
]
# markers to select tests, use `pytest --markers` to see all available markers, `pytest -m "<marker>"` to select tests
markers = [
    "unit: marks unit test, i.e. testing a single, well isolated functionality (deselect with '-m \"not unit\"')",
    "integration: marks test checking the elements when integrated into subsystems (deselect with '-m \"not integration\"')",
    "system: marks test working at the highest integration level (deselect with '-m \"not system\"')",
    "acceptance: marks test checking whether the developed product/model passes the user defined acceptance criteria (deselect with '-m \"not acceptance\"')",
    "docs: mark tests related to documentation (deselect with '-m \"not docs\"')",
    "skipduringci: marks tests that are skipped ci as they are addressed by Jenkins jobs but should be run to test user setups",
    "pleasefixme: marks tests that are broken and need fixing",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"
# SGLang 0.5.23 pins these versions; AutoModel 0.7.0 pins quack-kernels 0.6.4, transformers 5.18.0, and timm<=1.0.22.
override-dependencies = ["quack-kernels==0.6.5", "timm==1.0.25", "transformers==5.19.0"]
